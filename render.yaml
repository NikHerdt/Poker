# Render Blueprint: Poker WebSocket server
# https://docs.render.com/blueprint-spec
# Build runs from repo root: copy shared into server, then install. No rootDir so full repo is deployed.

services:
  - type: web
    name: poker-server
    runtime: node

    buildCommand: cp -r shared server/shared && cd server && npm install
    startCommand: cd server && npm start

    # Render sets PORT automatically; server reads process.env.PORT
    # Health check: GET / returns 200 (HTTP server runs alongside WebSocket)
    healthCheckPath: /
